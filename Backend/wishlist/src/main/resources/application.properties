server.port = 8083
spring.application.name = WishList_NewsNest

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/WishList_NewsNest?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql= true

eureka.client.register-with-eureka= true
eureka.client.fetch-registry= true


spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=wishlistgroup
#spring.kafka.consumer.group-id=authgroup
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


logging.file.name= wishlist/logs/WishList